<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
<title id="title">Side Quest — Make Some Noise</title>
<desc id="desc">A cyan and gold arcade title card with expanding sound waves and a moving equalizer. A GameMaker combat prototype starring Hype Man.</desc>
<style>
.wave{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}.delay{animation-delay:-1.5s}.bar{transform-box:fill-box;transform-origin:bottom;animation:beat 1s ease-in-out infinite alternate}.b2{animation-delay:-.3s}.b3{animation-delay:-.7s}.b4{animation-delay:-.5s}@keyframes pulse{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.3);opacity:0}}@keyframes beat{from{transform:scaleY(.3)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.wave,.bar{animation:none}.wave{opacity:.25}}
</style>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#172742" stroke-width="1"/></pattern><clipPath id="clip"><rect x="1" y="1" width="998" height="278" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)"><path fill="#071020" d="M0 0h1000v280H0z"/><path fill="url(#grid)" d="M0 0h1000v280H0z"/>
<circle class="wave" cx="812" cy="140" r="108" fill="none" stroke="#00d6ef" stroke-width="4"/><circle class="wave delay" cx="812" cy="140" r="108" fill="none" stroke="#00d6ef" stroke-width="3"/>
<path d="M42 42h48M42 42v24M958 238h-48M958 238v-24" stroke="#ffc45b" stroke-width="4" fill="none"/>
<text x="66" y="79" fill="#00d6ef" font-family="monospace" font-size="14" letter-spacing="4">NEWTYPE / GAME LAB</text>
<text x="62" y="149" fill="#f0f7ff" font-family="monospace" font-weight="bold" font-size="62" letter-spacing="3">SIDE QUEST</text>
<text x="66" y="190" fill="#ffc45b" font-family="monospace" font-size="19" letter-spacing="3">MAKE SOME NOISE.</text>
<text x="66" y="227" fill="#9fadc3" font-family="monospace" font-size="13">GAMEMAKER / PIXEL ART / COMBAT PROTOTYPE</text>
<g fill="#00d6ef"><rect class="bar" x="746" y="125" width="13" height="30"/><rect class="bar b2" x="768" y="100" width="13" height="80"/><rect class="bar b3" x="790" y="80" width="13" height="120"/><rect class="bar b4" x="812" y="91" width="13" height="98"/><rect class="bar b2" x="834" y="108" width="13" height="64"/><rect class="bar" x="856" y="122" width="13" height="36"/></g>
